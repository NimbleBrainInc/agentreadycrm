[project]
name = "agentreadycrm"
version = "0.2.0"
description = "A CRM for AI agents, as an MCP server with views: organizations, contacts, deals and the evidence behind them. Runs locally on one SQLite file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
    { name = "NimbleBrain Inc", email = "hello@nimblebrain.ai" },
]
keywords = ["mcp", "mcp-server", "mcp-apps", "crm", "contacts", "pipeline", "agents", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # FastMCP 4 on the MCP SDK v2: serves the 2026-07-28 era and the session-based eras from
    # one server. The ceiling excludes the next major, which removes 4.x compatibility shims.
    "fastmcp>=4,<5",
    "mcp>=2,<3",
    "pydantic>=2.12",
    "sqlalchemy[asyncio]>=2",
    # Annotations, announcements, listing rows, ids, skills and the error contract: the SDK
    # core only, no extras. A minor range: a 0.x minor may break, a patch keeps the Python API.
    # uv.lock picks the release, and only a pull request moves it, so the golden files gate
    # every bump.
    "nimblebrain-server-sdk>=0.8.1,<0.9",
    # Keyset paging. Pinned exactly: tests/test_paging_golden.py holds the cursors agents
    # already hold, so an upgrade is a deliberate, reviewed change.
    "pgkeyset==0.2.0",
    # Structured logs from the core: the access log and the server's own lines.
    "structlog",
    # The server reads a .env beside it when one exists.
    "python-dotenv",
    # The local runtime: SQLite through aiosqlite, its schema history through Alembic, and
    # local HTTP (agentreadycrm --http) through uvicorn.
    "aiosqlite>=0.21",
    "alembic>=1.14",
    "uvicorn",
]

[project.urls]
Homepage = "https://github.com/NimbleBrainInc/agentreadycrm"
Repository = "https://github.com/NimbleBrainInc/agentreadycrm.git"
Issues = "https://github.com/NimbleBrainInc/agentreadycrm/issues"

[project.scripts]
agentreadycrm = "mcp_people_local.__main__:main"

# The runtimes register here; PEOPLE_RUNTIME names the one a process serves.
[project.entry-points."mcp_people.runtimes"]
local = "mcp_people_local.runtime:LocalRuntime"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_people", "src/mcp_people_local"]

# Packs the built UI (ui/dist/index.html) into the wheel as mcp_people/ui_dist/index.html, and
# refuses to build a wheel without it.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The sdist carries the built UI, so a wheel built from it (pip, uv) packs the same views.
# It is a build output (ui/ is gitignored there), so it is named here, not found through git.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/ui/dist/index.html",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
]
artifacts = ["/ui/dist/index.html"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long - handled by formatter
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["mcp_people", "mcp_people_local"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pyyaml>=6",
    "ruff>=0.13.1",
    # Exact: each ty release adds diagnostics, so a lock refresh would fail typecheck on code
    # it did not touch. Move it on purpose, with the fixes it asks for.
    "ty==0.0.49",
]
